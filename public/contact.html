    <link rel="icon" href="favicon.ico" sizes="48x48" />

    <script src="src/js/main.js" defer></script>
  </head>
  <body>
    <nav class="side-nav" aria-label="Main">
      <a href="index.html">
        <svg class="side-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span class="side-nav__label">Home</span>
      </a>
      <a href="contact.html" aria-current="page">
        <svg class="side-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="side-nav__label">Contact</span>
      </a>
      <a href="legal.html">
        <svg class="side-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        <span class="side-nav__label">Legal notice</span>
      </a>
    </nav>

    <main>
      <section class="hero hero--compact">
        <img
          class="hero__image"
          src="assets/images/hero-contact.webp"
          alt=""
        />
        <div class="hero__content">
          <p class="badge">
            <span class="badge__dot" aria-hidden="true"></span>Get in touch
          </p>
          <h1>
            <span class="word" style="--i: 0">Contact</span>
          </h1>
        </div>
      </section>

      <section class="section">
        <div class="container container--narrow">
          <p class="lead">
            Have a question or a project in mind? Send a message and I will get
            back to you.
          </p>

          <!-- TODO: replace the action with your form endpoint (e.g. Formspree) -->
          <form
            class="form"
            action="https://formspree.io/f/YOUR_FORM_ID"
            method="POST"
          >
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <div class="form__consent">
              <input id="consent" name="consent" type="checkbox" required />
              <label for="consent">
                I have read the
                <a href="legal.html" target="_blank" rel="noopener noreferrer">legal notice</a>
                and agree that my data is used to reply to my message.
              </label>
            </div>

            <button class="button" type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Built and maintained by <strong><a href="https://github.com/njoh-simplice" target="_blank" rel="noopener noreferrer">Njoh Simplice Junior</a>.</strong></p>
    </footer>
  </body>
</html>
